<!doctype html>
<html>
  <head>
    <title>Contact Us</title>
  </head>
  <body>
    <h1>Contact Us</h1>
    <form action="">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" />
      <br /><br />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" />
      <br />

      <p>Your favourite subject</p>
      <input type="radio" name="subject" id="math" value="math" />
      <label for="math">Mathematics</label>
      <br />

      <input type="radio" name="subject" id="english" value="english" />
      <label for="english">English</label>
      <br />

      <input type="radio" name="subject" id="informatics" value="informatics" />
      <label for="informatics">Informatics</label>
      <br /><br />

      <label for="message">Your message:</label><br />
      <textarea name="message" id="message" rows="5" cols="40"></textarea>
      <br />

      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
